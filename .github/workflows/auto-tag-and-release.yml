name: Auto Tag & Release

on:
  push:
    branches:
      - main
    paths-ignore:
      - ".github/**"
      - "docs/**"
      - "**/README.md"
      - "**/ARCHITECTURE.md"
      - "**/INDEX.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  auto-tag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Derive the next version from the newest proper vX.Y.Z tag only.
      # Ignore the rolling "android-build-latest" tag (created by android-build.yml)
      # and any non-semver/garbage tags, otherwise version math breaks.
      - name: Derive next version
        id: version
        run: |
          LAST_TAG=$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1 || true)
          if [ -z "$LAST_TAG" ]; then
            echo "tag=v0.2.1" >> "$GITHUB_OUTPUT"
          else
            VERSION="${LAST_TAG#v}"
            MAJOR=$(printf '%s' "$VERSION" | cut -d. -f1)
            MINOR=$(printf '%s' "$VERSION" | cut -d. -f2)
            PATCH=$(printf '%s' "$VERSION" | cut -d. -f3)
            NEW_PATCH=$((PATCH + 1))
            echo "tag=v${MAJOR}.${MINOR}.${NEW_PATCH}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create and push tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.version.outputs.tag }}" -m "Release ${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"

      # Tags pushed via GITHUB_TOKEN do NOT trigger other workflows, so we must
      # explicitly dispatch the release build (android-release.yml) that produces
      # the visible GitHub release + APK asset.
      - name: Dispatch Android release build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run android-release.yml \
            --ref "${{ steps.version.outputs.tag }}" \
            -f release_tag="${{ steps.version.outputs.tag }}"
